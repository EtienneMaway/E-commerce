# nginx compression drop-in — install to /etc/nginx/conf.d/gzip.conf
#
# WHY THIS FILE EXISTS
# Ubuntu's stock /etc/nginx/nginx.conf ships `gzip on;` with the `gzip_types`
# line COMMENTED OUT. `gzip on` alone compresses only nginx's default type,
# text/html. Everything else — the JS bundle, CSS, and every API JSON response
# proxied from Next.js/Nest — goes out raw.
#
# Measured on www.kmb-talk.com (2026-07-19), login page JS:
#   745 KB raw  ->  233 KB gzipped   (-69%)
# On a 2G link at ~20 KB/s that is ~37s of download reduced to ~12s, before a
# single API call is made.
#
# Kept as a conf.d drop-in rather than an edit to the vendor nginx.conf so an
# `apt upgrade` of the nginx package cannot silently revert it.
#
# INSTALL
#   sudo cp deploy/nginx/gzip.conf /etc/nginx/conf.d/gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# VERIFY (both must print `content-encoding: gzip`)
#   curl -sI -H 'Accept-Encoding: gzip' https://www.kmb-talk.com/_next/static/chunks/<chunk>.js | grep -i content-encoding
#   curl -sI -H 'Accept-Encoding: gzip' -H "Authorization: Bearer <token>" https://api.kmb-talk.com/api/inventory/products | grep -i content-encoding

gzip on;

# Required here: the JS and JSON arrive at nginx via proxy_pass from Next.js and
# Nest. Without this nginx skips compression on proxied responses entirely —
# which is most of what this app serves.
gzip_proxied any;

# Tell caches the response varies by Accept-Encoding, so a gzipped body is never
# handed to a client that cannot decode it.
gzip_vary on;

# 5 is the standard sweet spot: level 9 costs materially more CPU for ~2% less
# output.
gzip_comp_level 5;

# Below ~256 bytes the gzip header can make a response LARGER, and it is not
# worth the CPU. Mirrors the `threshold` passed to compression() in
# apps/api/src/main.ts so both layers agree on the cutoff.
gzip_min_length 256;

gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    application/wasm;
