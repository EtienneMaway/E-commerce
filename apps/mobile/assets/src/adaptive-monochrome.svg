<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <!-- Single flat colour on transparent; Android 13+ recolours it to the theme.
       Only the glyph — a themed icon is a silhouette, so the disc would flatten
       into a solid blob. Scaled to sit where the K sits in the colour icon:
       0.495 x the visible circle, i.e. 0.239 of the 1024-space glyph. -->
  <g transform="translate(216,216) scale(0.239) translate(-512,-512)"
     stroke="#000000" stroke-width="108" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M364 268 V 756"/>
    <path d="M364 512 L 660 268"/>
    <path d="M364 512 L 660 756"/>
  </g>
</svg>
