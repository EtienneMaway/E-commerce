<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!--
    Play feature graphic, 1024x500.

    Play crops this on some surfaces and overlays a play button on others, so
    nothing important sits near the edges and the centre is kept clear of small
    text. The wordmark and tile stay within the middle band.
  -->
  <defs>
    <!-- "Market ledger" identity (same as the public site and the app since the
         November redesign): deep malachite, a copper glow, ledger rules. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E4A3B"/>
      <stop offset="100%" stop-color="#0A2F26"/>
    </linearGradient>
    <radialGradient id="copper" cx="0.92" cy="0.02" r="0.7">
      <stop offset="0%" stop-color="#F09A60" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#F09A60" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mal" cx="0.05" cy="1" r="0.6">
      <stop offset="0%" stop-color="#5FD9AE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5FD9AE" stop-opacity="0"/>
    </radialGradient>
    <!-- The mark, same drawing as logo-mark.svg (1024 space, scaled below). -->
    <radialGradient id="field" gradientUnits="userSpaceOnUse" cx="330" cy="260" r="900">
      <stop offset="0" stop-color="#1E9E76"/><stop offset="0.5" stop-color="#0E7A5B"/><stop offset="1" stop-color="#094A37"/>
    </radialGradient>
    <linearGradient id="kcopper" gradientUnits="userSpaceOnUse" x1="564" y1="446" x2="746" y2="760">
      <stop offset="0" stop-color="#F2A86C"/><stop offset="1" stop-color="#C25E27"/>
    </linearGradient>
    <mask id="cross" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <path d="M564 446 L 746 760" stroke="#000000" stroke-width="172" stroke-linecap="round"/>
    </mask>
    <filter id="tileShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#copper)"/>
  <rect width="1024" height="500" fill="url(#mal)"/>

  <!-- Ledger rules -->
  <g stroke="#EFE8D8" stroke-opacity="0.06" stroke-width="1.5">
    <path d="M0 70 H1024"/><path d="M0 118 H1024"/><path d="M0 166 H1024"/><path d="M0 214 H1024"/>
    <path d="M0 262 H1024"/><path d="M0 310 H1024"/><path d="M0 358 H1024"/><path d="M0 406 H1024"/><path d="M0 454 H1024"/>
  </g>

  <!-- The mark: malachite tile, paper K, copper leg crossing the arm. A thin
       paper rim lifts it off the equally green background. -->
  <g filter="url(#tileShadow)">
    <rect x="91" y="135" width="230" height="230" rx="56" fill="#EFE8D8" fill-opacity="0.16"/>
  </g>
  <g transform="translate(96,140) scale(0.21484)">
    <rect width="1024" height="1024" rx="250" fill="url(#field)"/>
    <g fill="none" stroke-linecap="round" stroke-width="112">
      <g mask="url(#cross)" stroke="#F3ECDF">
        <path d="M370 264 V 760"/>
        <path d="M370 600 L 706 264"/>
      </g>
      <path d="M564 446 L 746 760" stroke="url(#kcopper)"/>
    </g>
  </g>
  <text x="372" y="190" font-family="Fraunces" font-size="78" font-weight="600" fill="#EFE8D8" letter-spacing="-2">KMB-Talk</text>
  <text x="375" y="236" font-family="Fraunces" font-style="italic" font-size="30" font-weight="500" fill="#F09A60">Know what you are owed.</text>
  <text x="375" y="272" font-family="Fraunces" font-style="italic" font-size="30" font-weight="500" fill="#F09A60">Know what you owe.</text>

  <g font-family="JetBrains Mono" font-size="17" font-weight="500" letter-spacing="1.5">
    <g transform="translate(375,304)">
      <rect x="0.75" y="0.75" width="158" height="42" rx="21" fill="#EFE8D8" fill-opacity="0.08" stroke="#EFE8D8" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="79.5" y="27" fill="#EFE8D8" text-anchor="middle">INVENTORY</text>
    </g>
    <g transform="translate(547,304)">
      <rect x="0.75" y="0.75" width="110" height="42" rx="21" fill="#EFE8D8" fill-opacity="0.08" stroke="#EFE8D8" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="55.5" y="27" fill="#EFE8D8" text-anchor="middle">SALES</text>
    </g>
    <g transform="translate(671,304)">
      <rect x="0.75" y="0.75" width="232" height="42" rx="21" fill="#F09A60" fill-opacity="0.16" stroke="#F09A60" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="116.5" y="27" fill="#F6C29C" text-anchor="middle">DEBT TRACKING</text>
    </g>
  </g>
</svg>