<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!--
    Play feature graphic, 1024x500.

    Play crops this on some surfaces and overlays a play button on others, so
    nothing important sits near the edges and the centre is kept clear of small
    text. The wordmark and tile stay within the middle band.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.30" r="0.75">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="96" y1="140" x2="336" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E1FD"/>
      <stop offset="100%" stop-color="#D3CEFB"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="119" y1="163" x2="293" y2="337" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="tileShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1E1065" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- Faint ledger rules: a nod to bookkeeping without adding literal clutter. -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2">
    <path d="M0 118 H1024"/><path d="M0 214 H1024"/>
    <path d="M0 310 H1024"/><path d="M0 406 H1024"/>
  </g>

  <!-- The badge, same drawing as the launcher icon: pale ring, gradient disc,
       white K. 220px across, so ring/disc/glyph keep the 10.5 / 79 / 49.5 split. -->
  <g filter="url(#tileShadow)">
    <circle cx="206" cy="250" r="110" fill="url(#tile)"/>
  </g>
  <circle cx="206" cy="250" r="87" fill="url(#discGrad)"/>
  <g transform="translate(206,250) scale(0.183) translate(-512,-512)"
     stroke="#FFFFFF" stroke-width="108" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M364 268 V 756"/>
    <path d="M364 512 L 660 268"/>
    <path d="M364 512 L 660 756"/>
  </g>

  <text x="372" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="74" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">KMB-Talk</text>
  <text x="374" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="29" font-weight="500" fill="#FFFFFF" fill-opacity="0.88">Stock, sales and credit — in one place</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
    <g transform="translate(374,320)">
      <rect x="0" y="0" width="176" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.16"/>
      <text x="88" y="29" fill="#FFFFFF" text-anchor="middle">Inventory</text>
    </g>
    <g transform="translate(566,320)">
      <rect x="0" y="0" width="140" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.16"/>
      <text x="70" y="29" fill="#FFFFFF" text-anchor="middle">Sales</text>
    </g>
    <g transform="translate(722,320)">
      <rect x="0" y="0" width="196" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.16"/>
      <text x="98" y="29" fill="#FFFFFF" text-anchor="middle">Debt tracking</text>
    </g>
  </g>
</svg>
