<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!--
  KMB-Talk mark ("market ledger" identity, November 2026): a paper K on a
  malachite field whose copper leg crosses over the arm, the two sides of the
  books ("Know what you are owed. Know what you owe."). The crossing gap is a
  mask, not a field-coloured stroke, so it stays correct on any background.
  Every file in assets/src is drawn from the same K geometry (1024 space).
  Legacy (pre-API-26) square launcher: old launchers do not mask, so the corner is baked in.
-->
  <defs>
    <radialGradient id="field" gradientUnits="userSpaceOnUse" cx="330" cy="260" r="900">
      <stop offset="0" stop-color="#1E9E76"/><stop offset="0.5" stop-color="#0E7A5B"/><stop offset="1" stop-color="#094A37"/>
    </radialGradient>
    <linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="564" y1="446" x2="746" y2="760">
      <stop offset="0" stop-color="#F2A86C"/><stop offset="1" stop-color="#C25E27"/>
    </linearGradient>
    <mask id="cross" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <path d="M564 446 L 746 760" stroke="#000000" stroke-width="172" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#field)"/>
  <g fill="none" stroke-linecap="round" stroke-width="112">
    <g mask="url(#cross)" stroke="#F3ECDF">
      <path d="M370 264 V 760"/>
      <path d="M370 600 L 706 264"/>
    </g>
    <path d="M564 446 L 746 760" stroke="url(#copper)"/>
  </g>
</svg>
