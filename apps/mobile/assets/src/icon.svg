<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    KMB-Talk app icon — the badge from logo-mark.svg, squared off.

    Full-bleed on purpose: iOS applies its own squircle mask and Play rounds the
    listing icon itself, so baking a corner radius in here would show as a
    double-rounded edge. The pale field simply runs to the edges, and whatever
    mask the platform applies leaves it reading as the ring around the disc.

    Geometry matches logo-mark.svg exactly: disc at 79% of the width, K at
    49.5%, so the launcher icon and the in-app mark are the same drawing.
  -->
  <defs>
    <linearGradient id="bg" x1="108" y1="108" x2="916" y2="916" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Pale field — the ring, run out to the corners. -->
  <rect width="1024" height="1024" fill="#D3CEFB"/>

  <circle cx="512" cy="512" r="404" fill="url(#bg)"/>

  <g transform="translate(512,512) scale(0.851) translate(-512,-512)"
     stroke="#FFFFFF" stroke-width="108" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M364 268 V 756"/>
    <path d="M364 512 L 660 268"/>
    <path d="M364 512 L 660 756"/>
  </g>
</svg>
